name: Deploy via rsync

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    name: Sync files over SSH
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload release and swap it live
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PASSPHRASE: ${{ secrets.SSH_PASSPHRASE }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_TARGET_PATH: ${{ secrets.SSH_TARGET_PATH }}
          KEEP_RELEASES: 5
        run: |
          set -eu

          SSH_HOST_CLEAN="$(printf '%s' "$SSH_HOST" | tr -d '\r\n')"
          SSH_HOST_CLEAN="$(printf '%s' "$SSH_HOST_CLEAN" | awk '{$1=$1; print}')"
          case "$SSH_HOST_CLEAN" in
            *://*) SSH_HOST_CLEAN="${SSH_HOST_CLEAN#*://}" ;;
          esac
          SSH_HOST_CLEAN="${SSH_HOST_CLEAN%/}"
          SSH_HOST_CLEAN="${SSH_HOST_CLEAN##*@}"
          SSH_USERNAME_CLEAN="$(printf '%s' "$SSH_USERNAME" | tr -d '\r\n')"
          SSH_PORT_CLEAN="$(printf '%s' "$SSH_PORT" | tr -d '\r\n')"
          SSH_TARGET_PATH_CLEAN="$(printf '%s' "$SSH_TARGET_PATH" | tr -d '\r\n')"
          while [ "${SSH_TARGET_PATH_CLEAN%/}" != "$SSH_TARGET_PATH_CLEAN" ]; do
            SSH_TARGET_PATH_CLEAN="${SSH_TARGET_PATH_CLEAN%/}"
          done

          if ! printf '%s' "$SSH_HOST_CLEAN" | grep -Eq '^[A-Za-z0-9.-]+$'; then
            echo "Invalid SSH_HOST format. Use only a hostname like example.com or server.example.com (no protocol or path)."
            exit 1
          fi

          case "$SSH_TARGET_PATH_CLEAN" in
            /?*) ;;
            *)
              echo "Invalid SSH_TARGET_PATH. Use an absolute path to the web root, like /var/www/example.com (not /)."
              exit 1
              ;;
          esac

          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          cat > ~/.ssh/askpass.sh <<'EOF'
          #!/usr/bin/env sh
          printf '%s' "$SSH_PASSPHRASE"
          EOF
          chmod 700 ~/.ssh/askpass.sh

          eval "$(ssh-agent -s)"
          DISPLAY=:0 SSH_ASKPASS=~/.ssh/askpass.sh setsid -w ssh-add ~/.ssh/id_rsa < /dev/null

          # SSH_TARGET_PATH becomes a symlink to the live release. Releases
          # live in a sibling directory so they share a filesystem with it.
          TARGET="$SSH_TARGET_PATH_CLEAN"
          RELEASES="${TARGET}-releases"
          RELEASE="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          SSH_DEST="$SSH_USERNAME_CLEAN@$SSH_HOST_CLEAN"
          SSH_CMD="ssh -p $SSH_PORT_CLEAN -o StrictHostKeyChecking=accept-new"

          remote() {
            $SSH_CMD "$SSH_DEST" "bash -s -- $(printf '%q ' "$@")"
          }

          # Create the release directory and find the live release, if any,
          # so unchanged files can be hard-linked instead of re-uploaded.
          CURRENT="$(remote "$TARGET" "$RELEASES/$RELEASE" <<'EOF'
          set -eu
          mkdir -p "$2"
          if [ -L "$1" ]; then
            readlink -f "$1"
          elif [ -d "$1" ]; then
            printf '%s\n' "$1"
          fi
          EOF
          )"

          LINK_DEST=()
          if [ -n "$CURRENT" ]; then
            LINK_DEST=(--link-dest="$CURRENT")
          fi

          rsync -az "${LINK_DEST[@]}" \
            --exclude='.git*' \
            --exclude='.github' \
            --exclude='README.md' \
            --exclude='LICENSE' \
            -e "$SSH_CMD" \
            ./ "$SSH_DEST:$RELEASES/$RELEASE/"

          # Point the web root at the new release with a single rename(),
          # then prune old releases.
          remote "$TARGET" "$RELEASES" "$RELEASE" "$KEEP_RELEASES" <<'EOF'
          set -eu
          target=$1 releases=$2 release=$3 keep=$4
          new="$releases/$release"

          next="$target.next-$release"
          ln -s "$new" "$next"

          if [ -d "$target" ] && [ ! -L "$target" ]; then
            # One-time migration: the web root is still a real directory.
            # rename() can't replace a directory with a symlink, so exchange
            # the two in one renameat2(RENAME_EXCHANGE) call, which leaves
            # the old directory at $next. Anything short of an atomic
            # exchange aborts without touching the live site.
            if ! python3 -c '
          import ctypes, os, sys
          libc = ctypes.CDLL(None, use_errno=True)
          AT_FDCWD, RENAME_EXCHANGE = -100, 2
          if libc.renameat2(AT_FDCWD, os.fsencode(sys.argv[1]), AT_FDCWD, os.fsencode(sys.argv[2]), RENAME_EXCHANGE):
              sys.exit("renameat2: " + os.strerror(ctypes.get_errno()))
          ' "$next" "$target"; then
              rm -f "$next"
              echo "Could not atomically replace the web root directory with a symlink."
              echo "The live site is unchanged. See 'First deploy' in README.md to migrate by hand."
              exit 1
            fi
            mv "$next" "$target.pre-atomic-$release"
            echo "Moved previous web root to $target.pre-atomic-$release"
          else
            mv -T "$next" "$target"
          fi
          echo "Live: $target -> $new"

          for dir in $(ls -1 "$releases" | sort -r | tail -n +$((keep + 1))); do
            [ "$releases/$dir" = "$new" ] || rm -rf -- "$releases/$dir"
          done
          EOF
