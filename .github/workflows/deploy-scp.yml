name: Deploy via rsync

on:
  push:
    branches:
      - main

permissions:
  contents: read

# Queue deploys rather than cancelling one mid-swap: if the host can't do an
# atomic exchange, the swap falls back to two renames, and a cancel between
# them would leave the site without a document root.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up SSH with a pinned host key
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PASSPHRASE: ${{ secrets.SSH_PASSPHRASE }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_TARGET_PATH: ${{ secrets.SSH_TARGET_PATH }}
          SSH_HOST_FINGERPRINT: ${{ secrets.SSH_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail

          clean() { printf '%s' "$1" | tr -d '\r\n' | awk '{$1=$1; print}'; }

          SSH_HOST_CLEAN="$(clean "$SSH_HOST")"
          case "$SSH_HOST_CLEAN" in
            *://*) SSH_HOST_CLEAN="${SSH_HOST_CLEAN#*://}" ;;
          esac
          SSH_HOST_CLEAN="${SSH_HOST_CLEAN%/}"
          SSH_HOST_CLEAN="${SSH_HOST_CLEAN##*@}"
          SSH_USERNAME_CLEAN="$(clean "$SSH_USERNAME")"
          SSH_PORT_CLEAN="$(clean "$SSH_PORT")"
          FINGERPRINT="$(clean "$SSH_HOST_FINGERPRINT")"

          # Relative paths are relative to the SSH user's home directory.
          TARGET="$(clean "$SSH_TARGET_PATH")"
          TARGET="${TARGET#\~/}"
          while [ "${TARGET%/}" != "$TARGET" ]; do
            TARGET="${TARGET%/}"
          done

          if ! printf '%s' "$SSH_HOST_CLEAN" | grep -Eq '^[A-Za-z0-9.-]+$'; then
            echo "Invalid SSH_HOST format. Use only a hostname like example.com or server.example.com (no protocol or path)."
            exit 1
          fi

          case "/$TARGET/" in
            //|/./|*/../*|*'~'*)
              echo "Invalid SSH_TARGET_PATH. Use the web root, like public_html or /home/<user>/public_html."
              exit 1
              ;;
          esac

          # Without a pinned key, StrictHostKeyChecking would have to accept
          # whatever answers on this host and port.
          if [ -z "$FINGERPRINT" ]; then
            echo "SSH_HOST_FINGERPRINT is unset; refusing to deploy without verifying the host. See README.md." >&2
            exit 1
          fi
          case "$FINGERPRINT" in
            SHA256:*) ;;
            *) FINGERPRINT="SHA256:$FINGERPRINT" ;;
          esac

          install -m 700 -d ~/.ssh

          # Keep only the scanned host key that matches the pinned
          # fingerprint. ssh then refuses any other key.
          ssh-keyscan -p "$SSH_PORT_CLEAN" "$SSH_HOST_CLEAN" 2>/dev/null | grep -v '^#' > ~/.ssh/scanned_keys || true
          : > ~/.ssh/known_hosts
          while IFS= read -r line; do
            fp="$(printf '%s\n' "$line" | ssh-keygen -lf - | awk '{print $2}')"
            if [ "$fp" = "$FINGERPRINT" ]; then
              printf '%s\n' "$line" >> ~/.ssh/known_hosts
            fi
          done < ~/.ssh/scanned_keys
          rm -f ~/.ssh/scanned_keys

          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "The host presented no key matching SSH_HOST_FINGERPRINT. Refusing to connect." >&2
            exit 1
          fi

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          cat > ~/.ssh/askpass.sh <<'EOF'
          #!/usr/bin/env sh
          printf '%s' "$SSH_PASSPHRASE"
          EOF
          chmod 700 ~/.ssh/askpass.sh

          eval "$(ssh-agent -s)"
          DISPLAY=:0 SSH_ASKPASS=~/.ssh/askpass.sh setsid -w ssh-add ~/.ssh/id_rsa < /dev/null
          rm -f ~/.ssh/id_rsa ~/.ssh/askpass.sh

          SSH_CMD="ssh -p $SSH_PORT_CLEAN -o StrictHostKeyChecking=yes -o BatchMode=yes"
          {
            echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK"
            echo "SSH_AGENT_PID=$SSH_AGENT_PID"
            echo "SSH_CMD=$SSH_CMD"
            echo "SSH_DEST=$SSH_USERNAME_CLEAN@$SSH_HOST_CLEAN"
            echo "LIVE=$TARGET"
            echo "NEXT=${TARGET}_next"
            echo "PREV=${TARGET}_prev"
          } >> "$GITHUB_ENV"

          # `remote ARG...` runs the script on stdin on the server with ARGs
          # as $1, $2, ...
          install -d ~/.local/bin
          cat > ~/.local/bin/remote <<'EOF'
          #!/usr/bin/env bash
          exec $SSH_CMD "$SSH_DEST" "bash -s -- $(printf '%q ' "$@")"
          EOF
          chmod 755 ~/.local/bin/remote
          echo ~/.local/bin >> "$GITHUB_PATH"

      # The first connection only touches the staging directory, so a failed
      # handshake or unreachable host leaves the live site untouched.
      - name: Prepare clean staging directory
        run: |
          remote "$NEXT" <<'EOF'
          set -euo pipefail
          rm -rf -- "$1"
          mkdir -p -- "$1"
          EOF

      - name: Upload site to staging directory
        run: |
          rsync -az \
            --exclude='.git*' \
            --exclude='.github' \
            --exclude='README.md' \
            --exclude='LICENSE' \
            -e "$SSH_CMD" \
            ./ "$SSH_DEST:$NEXT/"

      # cPanel's IP Blocker writes `deny from` lines into the live
      # .htaccess, and lists blocks from public_html/.htaccess. The staged
      # build doesn't have them, so without this step every deploy would
      # silently unblock every address. cPanel stays the source of truth.
      - name: Carry cPanel IP Blocker rules into the staged .htaccess
        run: |
          remote "$LIVE" "$NEXT" <<'EOF'
          set -euo pipefail
          live="$1/.htaccess"
          staged="$2/.htaccess"

          denies=""
          if [ -f "$live" ]; then
            denies=$(
              { grep -iE '^[[:space:]]*deny[[:space:]]+from[[:space:]]+[^[:space:]]+[[:space:]]*$' "$live" || true; } \
                | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//; s/[[:space:]]+/ /g' \
                | tr 'A-Z' 'a-z' | LC_ALL=C sort -u
            )
          fi

          if [ -z "$denies" ]; then
            echo "No cPanel IP Blocker rules to carry over."
            exit 0
          fi

          {
            echo ""
            echo "# --- cPanel IP Blocker rules, carried across this deploy ---"
            echo "# Managed from cPanel > IP Blocker, never from this repo."
            echo "<Files 403.shtml>"
            echo "order allow,deny"
            echo "allow from all"
            echo "</Files>"
            echo ""
            printf '%s\n' "$denies"
          } >> "$staged"

          # Count only: the addresses shouldn't end up in the Actions log.
          echo "Carried over $(printf '%s\n' "$denies" | wc -l | tr -d ' ') IP Blocker rule(s)."
          EOF

      - name: Swap staging into the live document root
        run: |
          remote "$LIVE" "$NEXT" "$PREV" <<'EOF'
          set -euo pipefail
          live=$1 next=$2 prev=$3

          if [ ! -d "$next" ]; then
            echo "Staging directory $next is missing; aborting swap." >&2
            exit 1
          fi

          if [ ! -e "$live" ]; then
            mv -- "$next" "$live"
            echo "Moved new build into $live (there was no previous build)."
            exit 0
          fi

          if [ -L "$live" ] || [ ! -d "$live" ]; then
            echo "$live is not a directory; refusing to swap." >&2
            exit 1
          fi

          rm -rf -- "$prev"

          # renameat2(RENAME_EXCHANGE) swaps the two directories in one
          # step, so the document root is never missing. If python3 or the
          # syscall isn't available, fall back to two renames, which leaves
          # the document root absent for a moment.
          if command -v python3 >/dev/null && python3 -c '
          import ctypes, os, sys
          libc = ctypes.CDLL(None, use_errno=True)
          AT_FDCWD, RENAME_EXCHANGE = -100, 2
          if libc.renameat2(AT_FDCWD, os.fsencode(sys.argv[1]), AT_FDCWD, os.fsencode(sys.argv[2]), RENAME_EXCHANGE):
              sys.exit("renameat2: " + os.strerror(ctypes.get_errno()))
          ' "$next" "$live"; then
            mv -- "$next" "$prev"
            echo "Swapped new build into $live atomically (previous build kept at $prev)."
          else
            mv -- "$live" "$prev"
            mv -- "$next" "$live"
            echo "Swapped new build into $live with two renames; atomic exchange unavailable (previous build kept at $prev)."
          fi
          EOF

      - name: Verify site is responding
        run: curl --fail --silent --show-error --output /dev/null --max-time 15 --retry 3 --retry-delay 5 https://basesward3.com/
